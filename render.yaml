services:
  - type: web
    name: naskocuts
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: naskocuts-db
          property: connectionString
      - key: AdminSettings__Email
        value: admin@naskocuts.bg
      - key: AdminSettings__Password
        generateValue: false
        value: Admin123!
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: naskocuts-db
    plan: free
